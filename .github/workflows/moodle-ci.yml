name: Moodle Plugin CI

on:
  # Pull requests are built on every branch. Direct pushes build only on main, because
  # a dev -> main release PR has dev as its head: with dev also listed here, the push
  # and pull_request events fired the whole matrix twice for the same commit. Work
  # reaches dev through a PR, which already tests the merge result.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "test (${{ matrix.php }}, ${{ matrix.moodle-branch }}, ${{ matrix.database }})${{ matrix.optional && ' optional' || '' }}"
    runs-on: ubuntu-latest
    # A job marked optional reports its result without failing the run.
    continue-on-error: ${{ matrix.optional || false }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # One job per Moodle version the plugin supports. The databases alternate, so both stay covered.
        include:
          - php: "8.2"
            moodle-branch: "MOODLE_405_STABLE"
            database: "pgsql"
          - php: "8.4"
            moodle-branch: "MOODLE_501_STABLE"
            database: "mariadb"
          - php: "8.4"
            moodle-branch: "MOODLE_502_STABLE"
            database: "pgsql"
          # The next Moodle version, for information: its result does not fail the run.
          - php: "8.4"
            moodle-branch: "MOODLE_503_STABLE"
            database: "mariadb"
            optional: true

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # setup-php enables the OPcache JIT on PHP 8. In the Behat web server it made OPcache segfault and take
          # down all server processes mid-suite (PLS-1077); OPcache itself stays enabled.
          ini-values: max_input_vars=6000, opcache.jit=disable, opcache.jit_buffer_size=0
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          IGNORE_PATHS: 'styles/*.css'
          IGNORE_NAMES: 'layout_cards.mustache, extra_css.mustache, select2.js, select2.min.js, select2.min.css, mustache_custom_loader.php, data_collection_new.php'

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcpd

      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome
        env:
          # Serve the browser's parallel requests with several built-in web server processes.
          PHP_CLI_SERVER_WORKERS: 4

      # If the Behat web server dies mid-suite, every later scenario fails with ERR_CONNECTION_REFUSED and the
      # kernel log shows why. Until the JIT was disabled above, this was an OPcache segfault (PLS-1077).
      - name: Check the kernel log for crashed processes
        if: ${{ !cancelled() }}
        run: sudo dmesg -T | grep -iE 'out of memory|oom-kill|killed process|segfault|general protection' || echo 'None.'
